# Push to main: check, build the example site and deploy it to ds.joellithgow.com
# (wrangler.jsonc). The hostname itself is jlithgow-ops Terraform (terraform/workers.tf).
# npm publishing stays manual.
#
# Repo secrets: CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID (same account as joellithgow.com).
name: Deploy example

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run example:build
      - name: Deploy to Cloudflare
        run: npx wrangler@4.151.1 deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
