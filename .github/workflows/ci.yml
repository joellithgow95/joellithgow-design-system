# Every PR: build tokens, CSS, TS and the manifest, run the WCAG AA contrast
# check, and build the example site.
name: CI

on:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run example:build
